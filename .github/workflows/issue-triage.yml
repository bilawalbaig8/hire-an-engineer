name: Issue triage
on:
  issues:
    types: [opened, edited]
permissions:
  issues: write
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Label by skill, area and tool; thank reporter
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            // Everything is read from context.payload. Never put GitHub expressions in this script.
            const issue = context.payload.issue;
            const action = context.payload.action;
            const body = issue.body || "";

            // Allow-lists: dropdown text (as written in .github/ISSUE_TEMPLATE/*.yml) -> fixed short label.
            // Anything not listed here is ignored, so free text can never create a label.
            const SKILL = {
              "hire-an-engineer": "skill: hire-an-engineer",
              "other / not sure": "skill: other",
            };
            const AREA = {
              "discovery / planning": "area: discovery",
              "memory / PROJECT_STATE / docs": "area: memory",
              "getting unstuck": "area: unstuck",
              "UI/UX": "area: ui-ux",
              "database": "area: database",
              "integrations / APIs": "area: integrations",
              "process automation": "area: automation",
              "build / testing": "area: build-testing",
              "GitHub / releases": "area: releases",
              "cost tracking": "area: cost",
              "triggering (used wrongly or not used)": "area: triggering",
              "triggering (skill used when it shouldn't, or not used)": "area: triggering",
              "pacing / too many questions / too slow": "area: pacing",
              "other": "area: other",
            };
            const TOOL = {
              "claude.ai": "tool: claude.ai",
              "Claude Code": "tool: claude-code",
              "Cursor": "tool: cursor",
              "Codex": "tool: codex",
              "Antigravity": "tool: antigravity",
              "Gemini CLI": "tool: gemini-cli",
              "other": "tool: other",
            };

            const pick = (heading, map) => {
              const m = body.match(new RegExp(`### ${heading}\\s*\\n+([^\\n]+)`));
              const value = m ? m[1].trim() : null;
              if (!value || !Object.prototype.hasOwnProperty.call(map, value)) return null;
              return map[value];
            };

            const wanted = [pick("Skill", SKILL), pick("Area", AREA), pick("Tool", TOOL)].filter(Boolean);
            // Flag possible secrets so the owner can remove them quickly
            const secretPattern = /(sk-[A-Za-z0-9]{16,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)/;
            if (secretPattern.test(body)) wanted.push("possible-secret");

            // Backstop: GitHub label names are limited to 50 characters.
            const already = new Set((issue.labels || []).map((l) => (typeof l === "string" ? l : l.name)));
            const labels = [...new Set(wanted.map((n) => n.slice(0, 50)))].filter((n) => !already.has(n));
            if (!labels.length) return;

            async function ensureLabel(name) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name });
                return true;
              } catch (e) {
                if (e.status !== 404) { core.warning(`getLabel failed for "${name}": ${e.message}`); return false; }
              }
              try {
                await github.rest.issues.createLabel({ ...context.repo, name, color: "c5def5" });
                return true;
              } catch (e) {
                if (e.status === 422) return true; // created by another run in the meantime
                core.warning(`createLabel failed for "${name}": ${e.message}`);
                return false;
              }
            }

            const usable = [];
            for (const name of labels) {
              if (await ensureLabel(name)) usable.push(name);
            }
            if (!usable.length) return;

            await github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels: usable });

            // Comment once when the issue is opened; on edits only if a possible secret newly appeared.
            const secretNew = usable.includes("possible-secret");
            if (action !== "opened" && !secretNew) return;
            const note = secretNew
              ? "\n\n⚠️ This issue may contain a secret or key. Please revoke it in the provider's dashboard right away; the maintainer will remove it here."
              : "";
            await github.rest.issues.createComment({
              ...context.repo, issue_number: issue.number,
              body: "Thanks for the report! It's been labelled and will be reviewed." + note
            });
