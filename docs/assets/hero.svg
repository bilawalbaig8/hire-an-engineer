<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-labelledby="title desc">
  <title id="title">Hire an Engineer</title>
  <desc id="desc">Your AI tool becomes the senior engineer you never had to hire. No coding needed, plain words, and it asks before anything risky. A chat message asking for a bakery orders app turns into a plan you approved, a tested build, a live app with backups, and saved notes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b0a24" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1210" cy="40" r="190" fill="#6366f1" opacity="0.18"/>
  <circle cx="40" cy="520" r="170" fill="#f59e0b" opacity="0.10"/>
  <circle cx="720" cy="470" r="70" fill="#34d399" opacity="0.08"/>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="112" fill="#fbbf24" font-size="19" font-weight="700" letter-spacing="3">FOR PEOPLE WHO DON'T CODE</text>
    <text x="70" y="186" fill="#ffffff" font-size="66" font-weight="800">Hire an Engineer</text>
    <text x="72" y="240" fill="#c7d2fe" font-size="27">Your AI tool becomes the senior engineer</text>
    <text x="72" y="276" fill="#c7d2fe" font-size="27">you never had to hire.</text>

    <g font-size="20" font-weight="600">
      <rect x="72" y="314" width="222" height="44" rx="22" fill="#ffffff" fill-opacity="0.10" stroke="#a5b4fc" stroke-opacity="0.5"/>
      <text x="183" y="343" fill="#e0e7ff" text-anchor="middle">No coding needed</text>
      <rect x="308" y="314" width="250" height="44" rx="22" fill="#ffffff" fill-opacity="0.10" stroke="#a5b4fc" stroke-opacity="0.5"/>
      <text x="433" y="343" fill="#e0e7ff" text-anchor="middle">Plain words, any language</text>
      <rect x="72" y="370" width="300" height="44" rx="22" fill="#34d399" fill-opacity="0.16" stroke="#34d399" stroke-opacity="0.6"/>
      <text x="222" y="399" fill="#a7f3d0" text-anchor="middle">Asks before anything risky</text>
    </g>

    <text x="72" y="468" fill="#a5b4fc" font-size="18">Claude Code  ·  claude.ai  ·  Cursor  ·  Codex  ·  Antigravity</text>

    <!-- chat bubble -->
    <g filter="url(#shadow)">
      <rect x="800" y="72" width="410" height="96" rx="22" fill="#ffffff"/>
      <path d="M1170 168 L1196 194 L1150 168 Z" fill="#ffffff"/>
    </g>
    <text x="828" y="112" fill="#6b7280" font-size="15" font-weight="600" letter-spacing="1">YOU</text>
    <text x="828" y="146" fill="#1e1b4b" font-size="21">“I need a simple app for my bakery.”</text>

    <!-- arrow -->
    <path d="M1004 196 L1004 236" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <path d="M992 226 L1004 240 L1016 226" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- app window -->
    <g filter="url(#shadow)">
      <rect x="800" y="252" width="410" height="226" rx="20" fill="#ffffff"/>
    </g>
    <rect x="800" y="252" width="410" height="40" rx="20" fill="#eef2ff"/>
    <rect x="800" y="272" width="410" height="20" fill="#eef2ff"/>
    <circle cx="826" cy="272" r="6" fill="#f87171"/>
    <circle cx="846" cy="272" r="6" fill="#fbbf24"/>
    <circle cx="866" cy="272" r="6" fill="#34d399"/>
    <text x="1186" y="278" fill="#4338ca" font-size="15" font-weight="700" text-anchor="end">YOUR AI ENGINEER</text>

    <g font-size="20" fill="#1e293b">
      <circle cx="840" cy="324" r="14" fill="#10b981"/>
      <path d="M833 324 L838 330 L848 318" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="868" y="331">A plan you approved</text>

      <circle cx="840" cy="368" r="14" fill="#10b981"/>
      <path d="M833 368 L838 374 L848 362" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="868" y="375">Built and tested</text>

      <circle cx="840" cy="412" r="14" fill="#10b981"/>
      <path d="M833 412 L838 418 L848 406" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="868" y="419">Live, with backups</text>

      <circle cx="840" cy="456" r="14" fill="#10b981"/>
      <path d="M833 456 L838 462 L848 450" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="868" y="463">Notes saved for next time</text>
    </g>
  </g>
</svg>
