<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-labelledby="title desc">
  <title id="title">How it works</title>
  <desc id="desc">Four steps. 1: Tell it your idea in your own words. 2: Answer a few questions; it shows a plan and a preview before building. 3: Say yes once; then it works on its own and keeps you posted. 4: It builds and delivers, tested, live, with a guide and notes for next time. It always stops and asks before anything that costs money, publishes, goes live or deletes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b0a24" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="480" rx="28" fill="url(#bg)"/>
  <circle cx="1240" cy="470" r="150" fill="#6366f1" opacity="0.14"/>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="64" y="74" fill="#ffffff" font-size="34" font-weight="800">How it works</text>
    <text x="64" y="110" fill="#c7d2fe" font-size="21">You talk. It does the engineering.</text>

    <path d="M250 214 L1030 214" stroke="#818cf8" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>

    <!-- step 1: chat -->
    <g filter="url(#shadow)"><circle cx="200" cy="214" r="56" fill="#ffffff"/></g>
    <rect x="176" y="194" width="48" height="34" rx="9" fill="#4338ca"/>
    <path d="M186 228 L184 242 L198 228 Z" fill="#4338ca"/>
    <circle cx="189" cy="211" r="3.5" fill="#fff"/><circle cx="200" cy="211" r="3.5" fill="#fff"/><circle cx="211" cy="211" r="3.5" fill="#fff"/>

    <!-- step 2: plan -->
    <g filter="url(#shadow)"><circle cx="493" cy="214" r="56" fill="#ffffff"/></g>
    <rect x="473" y="188" width="40" height="52" rx="6" fill="none" stroke="#4338ca" stroke-width="4"/>
    <rect x="484" y="182" width="18" height="10" rx="3" fill="#4338ca"/>
    <path d="M481 206 L505 206 M481 217 L505 217 M481 228 L497 228" stroke="#4338ca" stroke-width="3.5" stroke-linecap="round"/>

    <!-- step 3: yes -->
    <g filter="url(#shadow)"><circle cx="787" cy="214" r="56" fill="#ffffff"/></g>
    <path d="M764 215 L780 232 L811 197" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- step 4: delivered -->
    <g filter="url(#shadow)"><circle cx="1080" cy="214" r="56" fill="#ffffff"/></g>
    <rect x="1054" y="190" width="52" height="36" rx="5" fill="none" stroke="#4338ca" stroke-width="4"/>
    <path d="M1072 238 L1088 238 M1080 226 L1080 238" stroke="#4338ca" stroke-width="4" stroke-linecap="round"/>
    <path d="M1070 208 L1077 215 L1091 201" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- number badges -->
    <g font-size="17" font-weight="800" text-anchor="middle" fill="#1e1b4b">
      <circle cx="240" cy="172" r="17" fill="#fbbf24"/><text x="240" y="178">1</text>
      <circle cx="533" cy="172" r="17" fill="#fbbf24"/><text x="533" y="178">2</text>
      <circle cx="827" cy="172" r="17" fill="#fbbf24"/><text x="827" y="178">3</text>
      <circle cx="1120" cy="172" r="17" fill="#fbbf24"/><text x="1120" y="178">4</text>
    </g>

    <g text-anchor="middle">
      <g fill="#ffffff" font-size="23" font-weight="700">
        <text x="200" y="314">Tell it your idea</text>
        <text x="493" y="314">Answer a few questions</text>
        <text x="787" y="314">Say yes once</text>
        <text x="1080" y="314">It builds and delivers</text>
      </g>
      <g fill="#c7d2fe" font-size="18">
        <text x="200" y="346">In your own words:</text>
        <text x="200" y="370">English, Urdu, any mix.</text>
        <text x="493" y="346">It shows a plan and a</text>
        <text x="493" y="370">preview before building.</text>
        <text x="787" y="346">Then it works on its own</text>
        <text x="787" y="370">and keeps you posted.</text>
        <text x="1080" y="346">Tested and live, with a</text>
        <text x="1080" y="370">guide and saved notes.</text>
      </g>
    </g>

    <rect x="64" y="404" width="1152" height="50" rx="25" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.55"/>
    <text x="640" y="436" fill="#fde68a" font-size="19" text-anchor="middle">It always stops and asks you before anything that costs money, publishes, goes live or deletes.</text>
  </g>
</svg>
